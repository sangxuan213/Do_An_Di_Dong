name: Build APK

on:
  push:
    tags: ["v*"]      # đẩy tag v2 → tự build và đưa APK lên Releases
  workflow_dispatch:   # hoặc bấm chạy tay trong tab Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/debug/app-debug.apk UTH-Document-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UTH-Document-apk
          path: UTH-Document-*.apk

      - name: Đưa APK lên Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: UTH-Document-*.apk
